<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Browser - Secure & Fast</title>
    <style>
        :root {
            --bg-titlebar: #0f172a;
            --bg-navbar: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --sidebar-bg: #020617;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-navbar);
            color: var(--text-color);
            overflow: hidden;
            user-select: none;
        }

        .window-titlebar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-titlebar);
            height: 30px;
            font-size: 12px;
            padding-left: 10px;
            -webkit-app-region: drag;
        }
        .window-controls { display: flex; -webkit-app-region: no-drag; }
        .win-btn {
            background: transparent; border: none; color: inherit; width: 40px; height: 30px;
            cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
        }
        .win-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .win-btn.close:hover { background: #ef4444; color: white; }

        .top-container { display: flex; background: var(--bg-titlebar); border-bottom: 1px solid var(--border-color); align-items: center; padding-right: 5px; }
        .tab-bar { display: flex; flex-grow: 1; height: 36px; align-items: center; padding-left: 8px; gap: 6px; overflow-x: auto; }
        .tab {
            background: rgba(0, 0, 0, 0.25); color: inherit; padding: 6px 14px; border-radius: 8px 8px 0 0;
            font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; max-width: 140px; min-width: 90px;
            overflow: hidden; white-space: nowrap;
        }
        .tab.active { background: var(--bg-navbar); border-top: 2px solid var(--accent-color); }
        .new-tab-btn { background: transparent; border: none; color: var(--accent-color); font-size: 18px; cursor: pointer; padding: 0 10px; }

        .nav-bar { display: flex; background: var(--bg-navbar); padding: 6px 10px; gap: 8px; align-items: center; border-bottom: 1px solid var(--border-color); }
        .nav-btn { background: rgba(255, 255, 255, 0.1); color: inherit; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .nav-btn:hover { background: var(--accent-color); color: #000; }
        .url-input { flex-grow: 1; background: rgba(0, 0, 0, 0.25); color: inherit; border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 6px; font-size: 13px; outline: none; }
        .url-input:focus { border-color: var(--accent-color); }

        .main-layout { display: flex; width: 100%; height: calc(100vh - 100px); position: relative; }
        .browser-view-container { flex-grow: 1; height: 100%; position: relative; }
        webview { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        /* సైడ్‌బార్ */
        .sidebar {
            width: 320px; background: var(--sidebar-bg); color: inherit; border-left: 1px solid var(--border-color);
            position: absolute; right: -320px; top: 0; height: 100%; display: flex; flex-direction: column;
            padding: 20px; box-sizing: border-box; z-index: 100; transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
        }
        .sidebar.open { right: 0; }
        .sidebar h3 { margin-top: 0; color: var(--accent-color); font-size: 18px; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .close-sidebar { background: transparent; border: none; color: inherit; cursor: pointer; font-size: 16px; }
        .sidebar-section { margin-bottom: 18px; font-size: 13px; }
        .sidebar-section label { display: block; margin-bottom: 6px; font-weight: bold; }
        .sidebar-section select { width: 100%; padding: 8px 12px; background: var(--bg-navbar); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 6px; outline: none; color-scheme: dark; }

        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .clear-btn { background: #ef4444; color: white; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .clear-btn:hover { background: #dc2626; }
        .history-list { flex-grow: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; font-size: 12px; max-height: 150px; }
        .history-list li { padding: 6px 8px; margin-bottom: 4px; background: rgba(255, 255, 255, 0.05); border-radius: 4px; word-break: break-all; }

        /* డౌన్‌లోడ్ ప్రోగ్రెస్ టోస్ట్ / పాపప్ */
        .download-toast {
            position: fixed; bottom: 20px; right: 20px; width: 280px; background: #020617;
            border: 1px solid var(--accent-color); border-radius: 8px; padding: 12px; color: #f8fafc;
            display: none; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .download-toast.active { display: block; }
        .progress-bar-container { width: 100%; background: #1e293b; height: 6px; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--accent-color); transition: width 0.2s ease; }
    </style>
</head>
<body>

    <div class="window-titlebar">
        <div style="display: flex; align-items: center; gap: 8px;">
            <svg width="18" height="18" viewBox="0 0 32 32" fill="none">
                <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
                <path d="M16 8C11.5817 8 8 11.5817 8 16C8 20.4183 11.5817 24 16 24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                <circle cx="16" cy="16" r="4" fill="currentColor"/>
            </svg>
            <span style="font-weight: bold; letter-spacing: 0.5px;">Vortex Browser</span>
        </div>
        <div class="window-controls">
            <button class="win-btn" onclick="minimizeWindow()">🗕</button>
            <button class="win-btn" onclick="maximizeWindow()">🗖</button>
            <button class="win-btn close" onclick="closeWindow()">✕</button>
        </div>
    </div>

    <div class="top-container">
        <div class="tab-bar" id="tabBar">
            <div class="tab active" data-id="1" onclick="switchTab(1)">
                <span id="tab-title-1">Google</span>
                <span onclick="closeTab(event, 1)" style="font-weight:bold; margin-left: 4px;">×</span>
            </div>
            <button class="new-tab-btn" onclick="addNewTab()" title="New Tab">+</button>
        </div>
        <button class="nav-btn" onclick="toggleSidebar()" style="background: transparent; border: none; font-size: 16px; margin-right: 5px;" title="Control Center">⚙️</button>
    </div>

    <!-- నావిగేషన్ బార్ (డౌన్‌లోడ్ బటన్‌తో సహా) -->
    <div class="nav-bar">
        <button class="nav-btn" onclick="goBack()">←</button>
        <button class="nav-btn" onclick="goForward()">→</button>
        <button class="nav-btn" onclick="reloadPage()">⟳</button>
        <input type="text" id="urlInput" class="url-input" placeholder="Search Google or type a URL..." />
        <button class="nav-btn" onclick="openDownloadsFolder()" title="Open Downloads Folder" style="background: #10b981; color: white;">📥 Downloads</button>
        <button class="nav-btn" onclick="savePage()" title="Save Webpage" style="background: #0284c7; color: white;">💾 Save Page</button>
        <button class="nav-btn" onclick="openIncognitoWindow()" style="background: #7c3aed; color: white;">Incognito</button>
    </div>

    <div class="main-layout">
        <div class="browser-view-container" id="viewContainer">
            <webview id="view-1" src="https://www.google.com" style="display: flex;"></webview>
        </div>

        <!-- కంట్రోల్ సెంటర్ సైడ్‌బార్ -->
        <div class="sidebar" id="sidebarPanel">
            <h3>
                <span>Control Center</span>
                <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
            </h3>
            
            <div class="sidebar-section">
                <label>🎨 Theme Customizer</label>
                <select id="themeSelector" onchange="changeTheme(this.value)">
                    <option value="dark">Dark Modern (Default)</option>
                    <option value="neon">Cyberpunk Neon Blue</option>
                    <option value="emerald">Emerald Forest</option>
                    <option value="sunset">Sunset Orange & Dark</option>
                    <option value="light">Light Clean Mode</option>
                </select>
            </div>

            <div class="sidebar-section">
                <label>🛡️ AdBlock & Security</label>
                <span style="color: #10b981; font-weight: bold; font-size: 12px;">● AdBlocker & 18+ Filter Active</span>
            </div>

            <!-- సైడ్‌బార్‌లో డౌన్‌లోడ్స్ లైవ్ లిస్ట్ మేనేజర్ -->
            <div class="sidebar-section">
                <label>📥 Downloads Manager</label>
                <div style="background: rgba(56, 189, 248, 0.05); border: 1px solid var(--border-color); padding: 8px; border-radius: 6px; max-height: 150px; overflow-y: auto;" id="downloadManagerList">
                    <span style="color: #94a3b8; font-size: 11px;">No active downloads</span>
                </div>
                <button onclick="openDownloadsFolder()" style="width: 100%; margin-top: 8px; background: var(--accent-color); color: #0f172a; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; text-align: center;">📂 Open Downloads Folder</button>
            </div>

            <div class="sidebar-section">
                <label>🌐 Page Translator</label>
                <select onchange="translatePage(this.value)">
                    <option value="">Select Language</option>
                    <option value="te">Telugu (తెలుగు)</option>
                    <option value="hi">Hindi (हिंदी)</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                </select>
            </div>

            <div class="sidebar-section" style="flex-grow: 1; display: flex; flex-direction: column;">
                <div class="history-header">
                    <label style="margin: 0;">📜 Browsing History</label>
                    <button class="clear-btn" onclick="clearHistory()">Clear All</button>
                </div>
                <ul class="history-list" id="historyList"></ul>
            </div>
        </div>
    </div>

    <!-- డౌన్‌లోడ్ ప్రోగ్రెస్ టోస్ట్ / పాపప్ -->
    <div class="download-toast" id="downloadToast">
        <div style="font-size: 12px; font-weight: bold; margin-bottom: 4px;" id="downloadFileName">Downloading...</div>
        <div style="font-size: 11px; color: #94a3b8;" id="downloadStatus">Initializing...</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

<script>
        const { ipcRenderer } = require('electron');

        let currentTabId = 1;
        let tabCount = 0;
        let browsingHistory = [];
        let activeDownloads = []; // డౌన్‌లోడ్స్ స్టోర్ చేయడానికి అరే
        const blockedKeywords = ['xnxx', 'xhamster', 'pornhub', 'nude', 'sex', 'adult', 'xxx', 'redtube', 'brazzers', 'xvideos', 'porn'];

        const urlInput = document.getElementById('urlInput');
        const viewContainer = document.getElementById('viewContainer');
        const tabBar = document.getElementById('tabBar');
        const historyList = document.getElementById('historyList');
        const downloadToast = document.getElementById('downloadToast');
        const downloadFileName = document.getElementById('downloadFileName');
        const downloadStatus = document.getElementById('downloadStatus');
        const progressBar = document.getElementById('progressBar');
        const downloadManagerList = document.getElementById('downloadManagerList'); // సైడ్‌బార్‌లో డౌన్‌లోడ్స్ కంటైనర్

        // బ్రౌజర్ స్టార్ట్ అయినప్పుడు ట్యాబ్స్ లోడ్ చేయడం (LocalStorage నుండి)
        window.addEventListener('DOMContentLoaded', () => { 
            loadSavedTabs();
        });

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                let query = urlInput.value.trim();
                let lowerQuery = query.toLowerCase();

                for (let keyword of blockedKeywords) {
                    if (lowerQuery.includes(keyword)) {
                        alert('⚠️ Access Blocked: 18+ / Adult content is strictly restricted!');
                        urlInput.value = "https://www.google.com";
                        return;
                    }
                }

                let targetUrl = query;
                if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                    if (targetUrl.includes('.') && !targetUrl.includes(' ')) {
                        targetUrl = 'https://' + targetUrl;
                    } else {
                        targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query) + '&safe=active';
                    }
                }

                const activeView = document.querySelector(`webview[id="view-${currentTabId}"]`);
                if (activeView) {
                    activeView.src = targetUrl;
                    saveTabsState(); // ట్యాబ్ మారగానే సేవ్ చేయడం
                }
            }
        });

        function setupWebViewSecurity(view, id, isPrivate) {
            view.addEventListener('will-navigate', (e) => {
                let navigatedUrl = e.url.toLowerCase();
                for (let keyword of blockedKeywords) {
                    if (navigatedUrl.includes(keyword)) {
                        e.preventDefault();
                        view.src = 'file://' + __dirname + '/blocked.html';
                        return;
                    }
                }
            });

            view.addEventListener('did-navigate', (e) => {
                let navigatedUrl = e.url.toLowerCase();
                for (let keyword of blockedKeywords) {
                    if (navigatedUrl.includes(keyword)) {
                        view.src = 'file://' + __dirname + '/blocked.html';
                        return;
                    }
                }
                if (!isPrivate && e.url) {
                    addToHistory(e.url);
                    saveTabsState(); // URL మారినప్పుడు ట్యాబ్ స్టేట్ సేవ్ చేయడం
                }
                if (currentTabId === id) urlInput.value = e.url;
            });

            view.addEventListener('page-title-updated', (e) => {
                const titleSpan = document.getElementById(`tab-title-${id}`);
                if (titleSpan) titleSpan.innerText = e.title;
                saveTabsState();
            });
        }

        // LocalStorage లో ట్యాబ్స్ సేవ్ చేసే ఫంక్షన్
        function saveTabsState() {
            const tabs = [];
            document.querySelectorAll('.tab').forEach(tab => {
                const id = tab.getAttribute('data-id');
                const view = document.getElementById(`view-${id}`);
                const titleSpan = document.getElementById(`tab-title-${id}`);
                if (view && view.src && !view.src.includes('incognito')) {
                    tabs.push({
                        id: id,
                        url: view.src,
                        title: titleSpan ? titleSpan.innerText : 'New Tab'
                    });
                }
            });
            localStorage.setItem('vortex_saved_tabs', JSON.stringify(tabs));
        }

        // LocalStorage నుండి ట్యాబ్స్ రీస్టోర్ చేసే ఫంక్షన్
        function loadSavedTabs() {
            const savedTabs = JSON.parse(localStorage.getItem('vortex_saved_tabs'));
            if (savedTabs && savedTabs.length > 0) {
                // ముందస్తుగా ఉన్న డిఫాల్ట్ ట్యాబ్‌ని క్లియర్ చేయడం
                tabBar.innerHTML = '<button class="new-tab-btn" onclick="addNewTab()" title="New Tab">+</button>';
                viewContainer.innerHTML = '';
                
                savedTabs.forEach((t, index) => {
                    tabCount = Math.max(tabCount, parseInt(t.id));
                    createTabElement(t.id, t.title, t.url, false);
                });
                switchTab(savedTabs[0].id);
            } else {
                addNewTab(false, 'https://www.google.com');
            }
        }

        function createTabElement(id, title, url, isActive = true) {
            const newTab = document.createElement('div');
            newTab.className = `tab ${isActive ? 'active' : ''}`;
            newTab.setAttribute('data-id', id);
            newTab.innerHTML = `<span id="tab-title-${id}">${title}</span> <span onclick="closeTab(event, ${id})" style="font-weight:bold; margin-left:4px;">×</span>`;
            newTab.onclick = () => switchTab(id);
            
            tabBar.insertBefore(newTab, tabBar.lastElementChild);

            const newView = document.createElement('webview');
            newView.id = `view-${id}`;
            newView.src = url;
            newView.style.display = isActive ? 'flex' : 'none';
            
            viewContainer.appendChild(newView);
            setupWebViewSecurity(newView, id, false);
        }

        function addNewTab(isPrivate = false, customUrl = 'https://www.google.com') {
            tabCount++;
            const newId = tabCount;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('webview').forEach(v => v.style.display = 'none');

            const newTab = document.createElement('div');
            newTab.className = 'tab active';
            if(isPrivate) newTab.style.borderTopColor = '#7c3aed';
            newTab.setAttribute('data-id', newId);
            newTab.innerHTML = `<span id="tab-title-${newId}">${isPrivate ? 'Incognito' : 'New Tab'}</span> <span onclick="closeTab(event, ${newId})" style="font-weight:bold; margin-left:4px;">×</span>`;
            newTab.onclick = () => switchTab(newId);
            
            tabBar.insertBefore(newTab, tabBar.lastElementChild);

            const newView = document.createElement('webview');
            newView.id = `view-${newId}`;
            newView.src = customUrl;
            if (isPrivate) newView.partition = 'persist:incognito_' + Math.random();
            
            viewContainer.appendChild(newView);
            setupWebViewSecurity(newView, newId, isPrivate);

            currentTabId = newId;
            updateUrlBar();
            saveTabsState();
        }

        function switchTab(id) {
            currentTabId = id;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('webview').forEach(v => v.style.display = 'none');

            const selectedTab = document.querySelector(`.tab[data-id="${id}"]`);
            const selectedView = document.getElementById(`view-${id}`);

            if (selectedTab) selectedTab.classList.add('active');
            if (selectedView) {
                selectedView.style.display = 'flex';
                urlInput.value = selectedView.src;
            }
        }

        function closeTab(event, id) {
            event.stopPropagation();
            if (document.querySelectorAll('.tab').length <= 1) return;
            const tab = document.querySelector(`.tab[data-id="${id}"]`);
            const view = document.getElementById(`view-${id}`);
            if (tab) tab.remove();
            if (view) view.remove();
            const remainingTabs = document.querySelectorAll('.tab');
            const lastTabId = remainingTabs[remainingTabs.length - 1].getAttribute('data-id');
            switchTab(parseInt(lastTabId));
            saveTabsState();
        }

        // సైడ్‌బార్‌లో డౌన్‌లోడ్స్ లైవ్ లిస్ట్ అప్‌డేట్ చేయడం
        ipcRenderer.on('download-started', (event, data) => {
            downloadToast.classList.add('active');
            downloadFileName.innerText = data.fileName;
            downloadStatus.innerText = "Downloading...";
            progressBar.style.width = "0%";

            // సైడ్‌బార్ లిస్ట్‌లో యాడ్ చేయడం
            activeDownloads.unshift({ fileName: data.fileName, progress: '0%', status: 'Downloading...' });
            renderDownloadsList();
        });

        ipcRenderer.on('download-progress', (event, data) => {
            downloadStatus.innerText = `Downloading... ${data.progress}%`;
            progressBar.style.width = `${data.progress}%`;

            if(activeDownloads.length > 0) {
                activeDownloads[0].progress = data.progress + '%';
                renderDownloadsList();
            }
        });

        ipcRenderer.on('download-completed', (event, data) => {
            downloadStatus.innerText = "Download Completed! ✅";
            progressBar.style.width = "100%";

            if(activeDownloads.length > 0) {
                activeDownloads[0].progress = '100%';
                activeDownloads[0].status = 'Completed ✅';
                renderDownloadsList();
            }
            setTimeout(() => { downloadToast.classList.remove('active'); }, 4000);
        });

        ipcRenderer.on('download-failed', (event, data) => {
            downloadStatus.innerText = "Download Failed ❌";
            progressBar.style.background = "#ef4444";

            if(activeDownloads.length > 0) {
                activeDownloads[0].status = 'Failed ❌';
                renderDownloadsList();
            }
        });

        function renderDownloadsList() {
            if(!downloadManagerList) return;
            downloadManagerList.innerHTML = '';
            if(activeDownloads.length === 0) {
                downloadManagerList.innerHTML = '<span style="color: #94a3b8; font-size: 11px;">No active downloads</span>';
                return;
            }
            activeDownloads.forEach(item => {
                const div = document.createElement('div');
                div.style.cssText = "background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; margin-bottom: 6px; font-size: 11px;";
                div.innerHTML = `
                    <div style="font-weight: bold; color: var(--text-color); margin-bottom: 2px;" title="${item.fileName}">${item.fileName}</div>
                    <div style="display: flex; justify-content: space-between; color: var(--accent-color);">
                        <span>${item.status}</span>
                        <span>${item.progress}</span>
                    </div>
                `;
                downloadManagerList.appendChild(div);
            });
        }

        function openDownloadsFolder() {
            ipcRenderer.send('open-downloads-folder');
        }

        // ఇతర బేసిక్ ఫంక్షన్స్
        function updateUrlBar() {
            const activeView = document.getElementById(`view-${currentTabId}`);
            if (activeView) urlInput.value = activeView.src;
        }

        function toggleSidebar() { document.getElementById('sidebarPanel').classList.toggle('open'); }

        async function savePage() {
            const activeView = document.querySelector(`webview[id="view-${currentTabId}"]`);
            if (activeView) {
                try {
                    const title = activeView.getTitle() || 'page';
                    const safeTitle = title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                    const filePath = await ipcRenderer.invoke('save-page-dialog', `${safeTitle}.html`);
                    if (filePath) {
                        activeView.savePage(filePath, 'HTMLComplete').then(() => {
                            alert('Page saved successfully!');
                        });
                    }
                } catch (e) {}
            }
        }

        function translatePage(lang) {
            if (!lang) return;
            const activeView = document.querySelector(`webview[id="view-${currentTabId}"]`);
            if (activeView) {
                activeView.executeJavaScript(`
                    window.location.href = "https://translate.google.com/translate?sl=auto&tl=${lang}&u=" + encodeURIComponent(window.location.href);
                `);
            }
        }

        function changeTheme(theme) {
            const root = document.documentElement;
            if (theme === 'neon') {
                root.style.setProperty('--bg-titlebar', '#030712'); root.style.setProperty('--bg-navbar', '#111827');
                root.style.setProperty('--accent-color', '#3b82f6'); root.style.setProperty('--text-color', '#93c5fd');
                root.style.setProperty('--sidebar-bg', '#020617'); root.style.setProperty('--border-color', '#1e3a8a');
            } else if (theme === 'emerald') {
                root.style.setProperty('--bg-titlebar', '#022c22'); root.style.setProperty('--bg-navbar', '#064e3b');
                root.style.setProperty('--accent-color', '#34d399'); root.style.setProperty('--text-color', '#a7f3d0');
                root.style.setProperty('--sidebar-bg', '#011c16'); root.style.setProperty('--border-color', '#065f46');
            } else if (theme === 'sunset') {
                root.style.setProperty('--bg-titlebar', '#431407'); root.style.setProperty('--bg-navbar', '#7c2d12');
                root.style.setProperty('--accent-color', '#fb923c'); root.style.setProperty('--text-color', '#ffedd5');
                root.style.setProperty('--sidebar-bg', '#290b04'); root.style.setProperty('--border-color', '#9a3412');
            } else if (theme === 'light') {
                root.style.setProperty('--bg-titlebar', '#cbd5e1'); root.style.setProperty('--bg-navbar', '#f8fafc');
                root.style.setProperty('--accent-color', '#0284c7'); root.style.setProperty('--text-color', '#0f172a');
                root.style.setProperty('--sidebar-bg', '#e2e8f0'); root.style.setProperty('--border-color', '#94a3b8');
            } else {
                root.style.setProperty('--bg-titlebar', '#020617'); root.style.setProperty('--bg-navbar', '#1e293b');
                root.style.setProperty('--accent-color', '#38bdf8'); root.style.setProperty('--text-color', '#f8fafc');
                root.style.setProperty('--sidebar-bg', '#020617'); root.style.setProperty('--border-color', 'rgba(255, 255, 255, 0.1)');
            }
        }

        function addToHistory(url) {
            if (!browsingHistory.includes(url)) {
                browsingHistory.unshift(url);
                renderHistory();
            }
        }

        function clearHistory() { browsingHistory.length = 0; renderHistory(); }

        function renderHistory() {
            historyList.innerHTML = '';
            browsingHistory.forEach(url => {
                const li = document.createElement('li');
                li.innerText = url;
                historyList.appendChild(li);
            });
        }

        function goBack() { const activeView = document.getElementById(`view-${currentTabId}`); if (activeView && activeView.canGoBack()) activeView.goBack(); }
        function goForward() { const activeView = document.getElementById(`view-${currentTabId}`); if (activeView && activeView.canGoForward()) activeView.goForward(); }
        function reloadPage() { const activeView = document.getElementById(`view-${currentTabId}`); if (activeView) activeView.reload(); }

        function openIncognitoWindow() { ipcRenderer.send('open-incognito-window'); }
        function openDevTools() { ipcRenderer.send('open-devtools'); }
        function minimizeWindow() { ipcRenderer.send('window-minimize'); }
        function maximizeWindow() { ipcRenderer.send('window-maximize'); }
        function closeWindow() { ipcRenderer.send('window-close'); }
    </script>
</body>
</html>
